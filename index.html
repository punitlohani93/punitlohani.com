<html>
    <head></head>
    <body>Web socket example</body>
    <script>
        let ws;
        const proto = window.location.protocol === 'https' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${window.location.host}`);

        ws.onmessage = (event) => {console.log('logging event.data: ', event.data)};
    </script>
</html>
